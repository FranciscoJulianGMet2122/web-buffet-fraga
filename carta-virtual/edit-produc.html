<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - Buffet Fragata Libertad Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-6 font-sans selection:bg-white selection:text-black">

    <div class="bg-neutral-950 border border-neutral-800 rounded-3xl shadow-2xl w-full max-w-lg p-8">
        
        <div class="flex justify-between items-center mb-6 border-b border-neutral-800 pb-4">
            <div>
                <h1 class="text-xl font-black text-white tracking-wider">EDITAR PRODUCTO</h1>
                <p class="text-xs text-neutral-400 mt-0.5">Modificá los datos del producto seleccionado</p>
            </div>
            <a href="admin.html" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-300 text-xs font-bold px-3.5 py-2 rounded-xl transition border border-neutral-800">
                &larr; Volver
            </a>
        </div>

        <form id="editForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold mb-1 text-neutral-300">Nombre del Producto</label>
                <input type="text" id="editNombre" required 
                       class="w-full px-3.5 py-2.5 bg-neutral-900 rounded-xl text-sm border border-neutral-800 focus:ring-2 focus:ring-white focus:outline-none text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-neutral-300">Precio ($)</label>
                <input type="number" id="editPrecio" required step="0.01" 
                       class="w-full px-3.5 py-2.5 bg-neutral-900 rounded-xl text-sm border border-neutral-800 focus:ring-2 focus:ring-white focus:outline-none text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-neutral-300">URL de la Imagen</label>
                <input type="url" id="editFoto" 
                       class="w-full px-3.5 py-2.5 bg-neutral-900 rounded-xl text-sm border border-neutral-800 focus:ring-2 focus:ring-white focus:outline-none text-white">
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-neutral-300">Descripción detallada</label>
                <textarea id="editDesc" rows="3" 
                          class="w-full px-3.5 py-2.5 bg-neutral-900 rounded-xl text-sm border border-neutral-800 focus:ring-2 focus:ring-white focus:outline-none text-white resize-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1 text-neutral-300">Opciones configurables (separadas por coma)</label>
                <input type="text" id="editOpciones" 
                       class="w-full px-3.5 py-2.5 bg-neutral-900 rounded-xl text-sm border border-neutral-800 focus:ring-2 focus:ring-white focus:outline-none text-white">
            </div>

            <div class="pt-2 flex space-x-3">
                <button type="submit" 
                        class="w-full bg-white hover:bg-neutral-200 text-black font-bold py-3 rounded-xl transition text-sm shadow-lg">
                    Guardar Cambios
                </button>
                <a href="admin.html" 
                   class="w-1/3 bg-neutral-900 hover:bg-neutral-800 text-center font-bold py-3 rounded-xl transition text-sm border border-neutral-800 text-neutral-300 flex items-center justify-center">
                    Cancelar
                </a>
            </div>
        </form>

    </div>

    <!-- Script de edición con ruta asegurada -->
    <script type="module" src="./src/edit.js"></script>
</body>
</html>
